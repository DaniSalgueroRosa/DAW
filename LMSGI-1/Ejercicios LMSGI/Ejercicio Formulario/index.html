<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pixel Zone - Reserva</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <header>
        <img src="" >
    </header>

   
    <main>
        <form action="procesarreserva.php" method="post">
            <fieldset>
                <legend>Nueva reserva</legend>

                <div class="campo">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Nombre y apellidos" required>
                </div>

                <div class="campo">
                    <label for="correo">Correo:</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono">
                </div>

           

                <div class="campo">
                    <label for="producto">Producto:</label>
                    <input type="text" id="producto" name="producto" list="lista-juegos" placeholder="Escribe o selecciona un producto" required>
                    <!-- definir datalist-->
                    <datalist id="lista-juegos">
                        <option value="EA Sports FC 27">
                        <option value="Minecraft">
                    </datalist>
                </div>

                <div class="campo">
                    <label>Edición:</label>
                    <!-- terminar coleccionista -->
                    <label><input type="radio" name="edicion" value="Estandard" checked> Estándar</label>
                    <label><input type="radio" name="edicion" value="Deluxe"> Deluxe</label>
                </div>

                <div class="campo">
                    <label for="cantidad">Cantidad:</label>
                    <input type="number" id="cantidad" name="cantidad" value="1" required>
                </div>

                <div class="campo">
                    <label for="fecha">Fecha de recogida:</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <div class="campo">
                    <label for="presupuesto">Presupuesto máximo:</label>
                    <input type="range" id="presupuesto" name="presupuesto" min="0" max="100">
                </div>

                <div class="campo-bloque">
                    <label for="observaciones">Observaciones:</label>
                    <textarea id="observaciones" name="observaciones" placeholder="Indica aquí cualquier observación sobre la reserva"></textarea>
                </div>

                <div class="campo-bloque">
                    <label for="imagen">Imagen del producto:</label>
                    <input type="file" id="imagen" name="imagen">
                </div>

                
                <div class="acciones">
                    <button type="submit">Enviar reserva</button>
                    <!-- botón de reset -->
                </div>
            </fieldset>
        </form>
    </main>


    <footer>
        <h3>Síguenos en redes</h3>
        <div class="redes">
           
            
        </div>
    </footer>

</body>
</html>
